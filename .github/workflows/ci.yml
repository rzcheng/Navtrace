name: NavTrace
on: [push, pull_request]
jobs:
  build-test-demo:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: x64
          - os: macos-15
            architecture: arm64
    runs-on: ${{ matrix.os }}
    env:
      UBSAN_OPTIONS: halt_on_error=1
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.deps/oracle
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.architecture }}
      - name: Local Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-lock.txt
      - name: Install the pinned oracle backend
        run: |
          .venv/bin/python -m pip install \
            --index-url https://pypi.org/simple \
            --only-binary=:all: --require-hashes --no-deps \
            --target .deps/oracle -r requirements-oracle-ci-lock.txt
      - name: Build with warnings and sanitizers
        run: |
          .venv/bin/cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNAVTRACE_SANITIZE=ON
          .venv/bin/cmake --build build --parallel 2
      - name: Tests
        run: |
          mkdir -p results/ci-tests
          .venv/bin/ctest --test-dir build --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/results/ci-tests/ctest.xml"
          .venv/bin/python -m pytest -q -W error::RuntimeWarning \
            --junitxml=results/ci-tests/pytest.xml
      - name: Headless demo smoke test
        run: .venv/bin/python tools/run_demo.py --binary build/navtrace_replay --output results/ci-smoke
      - name: GPS fault study smoke test (development seed only)
        run: .venv/bin/python tools/run_fault_study.py --binary build/navtrace_replay --output results/ci-fault-smoke --development-smoke
      - name: Consistency study smoke test (development seed only)
        run: .venv/bin/python tools/run_consistency_study.py --binary build/navtrace_replay --output results/ci-consistency-smoke --smoke
      - name: Long GPS outage smoke test (development seed only)
        run: .venv/bin/python tools/run_long_outage.py --binary build/navtrace_replay --output results/ci-long-outage --development-smoke
      - name: Save test reports and development diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-${{ matrix.os }}-${{ matrix.architecture }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/Testing/Temporary/LastTest.log
            results/ci-tests/*.xml
            results/ci-*/manifest.json
            results/ci-*/metrics.csv
            results/ci-*/metrics.json
            results/ci-*/summary.csv
            results/ci-*/*.png
